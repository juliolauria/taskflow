<div class="modal-overlay" onclick="document.getElementById('modal-root').innerHTML=''">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div>
      <div class="modal-header">
        <h3>Edit task</h3>
        <button type="button" class="modal-close" onclick="document.getElementById('modal-root').innerHTML=''" aria-label="Close">&times;</button>
      </div>

      <label class="field">
        <span>Title</span>
        <input
          type="text"
          value="{{ task.title }}"
          name="value"
          required
          hx-post="/tasks/{{ task.id }}/field?project={{ current_filter }}"
          hx-trigger="input changed delay:500ms, change, blur"
          hx-vals='{"field": "title"}'
          hx-swap="none"
        >
      </label>

      <label class="field">
        <span>Comments</span>
        <textarea
          name="value"
          rows="2"
          placeholder="Quick comment…"
          hx-post="/tasks/{{ task.id }}/field?project={{ current_filter }}"
          hx-trigger="input changed delay:500ms, change, blur"
          hx-vals='{"field": "comments"}'
          hx-swap="none"
        >{{ task.comments or "" }}</textarea>
      </label>

      <label class="field">
        <span>Project</span>
        <select
          name="value"
          required
          hx-post="/tasks/{{ task.id }}/field?project={{ current_filter }}"
          hx-trigger="change"
          hx-vals='{"field": "project_id"}'
          hx-swap="none"
        >
          {% for p in projects %}
          <option value="{{ p.id }}" {% if p.id == task.project_id %}selected{% endif %}>{{ p.name }}</option>
          {% endfor %}
        </select>
      </label>

      <label class="field">
        <span>Status <button type="button" class="manage-link" hx-get="/statuses/manage" hx-target="#modal-root" hx-swap="innerHTML">Manage</button></span>
        <select
          name="value"
          style="background: {{ status_colors.get(task.status, '#888888') }}33; color: {{ status_colors.get(task.status, '#888888') }};"
          hx-post="/tasks/{{ task.id }}/field?project={{ current_filter }}"
          hx-trigger="change"
          hx-vals='{"field": "status"}'
          hx-swap="none"
        >
          {% for s in statuses %}
          <option value="{{ s.name }}" style="background: {{ s.color }}; color: #fff;" {% if s.name == task.status %}selected{% endif %}>{{ s.name }}</option>
          {% endfor %}
        </select>
      </label>

      <label class="field">
        <span>Priority</span>
        <select
          name="value"
          style="background: {{ priority_colors.get(task.priority.value, '#888888') }}33; color: {{ priority_colors.get(task.priority.value, '#888888') }};"
          hx-post="/tasks/{{ task.id }}/field?project={{ current_filter }}"
          hx-trigger="change"
          hx-vals='{"field": "priority"}'
          hx-swap="none"
        >
          {% for p in priorities %}
          <option value="{{ p.value }}" style="background: {{ priority_colors.get(p.value, '#888888') }}; color: #fff;" {% if p == task.priority %}selected{% endif %}>{{ p.value }}</option>
          {% endfor %}
        </select>
      </label>

      <label class="field">
        <span>Responsible <button type="button" class="manage-link" hx-get="/responsibles/manage" hx-target="#modal-root" hx-swap="innerHTML">Manage</button></span>
        <input
          type="text"
          value="{{ task.responsible }}"
          list="responsible-datalist"
          placeholder="Unassigned"
          name="value"
          hx-post="/tasks/{{ task.id }}/field?project={{ current_filter }}"
          hx-trigger="input changed delay:500ms, change, blur"
          hx-vals='{"field": "responsible"}'
          hx-swap="none"
        >
      </label>

      <label class="field">
        <span>Target date</span>
        <input
          type="date"
          value="{{ task.deadline.isoformat() if task.deadline else '' }}"
          name="value"
          hx-post="/tasks/{{ task.id }}/field?project={{ current_filter }}"
          hx-trigger="change"
          hx-vals='{"field": "deadline"}'
          hx-swap="none"
        >
      </label>

      <div class="field">
        <span>Date created</span>
        <p class="field-readonly">{{ task.created_at.strftime("%d %b %Y") if task.created_at else "—" }}</p>
      </div>

      <div class="modal-actions">
        <button
          type="button"
          class="btn-danger"
          hx-delete="/tasks/{{ task.id }}?project={{ current_filter }}"
          hx-target="#modal-root"
          hx-swap="innerHTML"
          hx-vals='{"redirect_to": "{{ redirect_to or '' }}"}'
          hx-confirm="Delete this task?"
        >Delete</button>
        <div class="modal-actions-right">
          <button type="button" class="btn-secondary" onclick="document.getElementById('modal-root').innerHTML=''">Close</button>
        </div>
      </div>
    </div>

    <div class="task-checklist-block">
      <h4>Checklist</h4>
      <div id="{{ target_id }}">
        {% include "partials/checklist_fragment.html" %}
      </div>
    </div>
  </div>
</div>
