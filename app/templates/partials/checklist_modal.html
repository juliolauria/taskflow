<div class="modal-overlay" onclick="document.getElementById('modal-root').innerHTML=''">
  <div class="modal-box modal-box-narrow" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="checklist-modal-heading">
        <h3>Checklist</h3>
        <p class="checklist-modal-subtitle">{{ task.title }}</p>
      </div>
      <button type="button" class="modal-close" onclick="document.getElementById('modal-root').innerHTML=''" aria-label="Close">&times;</button>
    </div>

    {% set target_id = "modal-root" %}
    {% set embedded = false %}
    {% include "partials/checklist_fragment.html" %}
  </div>
</div>
